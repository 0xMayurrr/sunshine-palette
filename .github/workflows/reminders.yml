name: Reminder Worker

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminder cron
        run: |
          SECRET="${{ secrets.CRON_SECRET }}"
          [ -z "$SECRET" ] && SECRET="reminders@buildicy.com"
          curl -s -o /dev/null -w "%{http_code}" \
            "https://calendar.buildicy.com/api/cron?secret=$SECRET"
